plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    // id 'kotlin-android-extensions'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id("com.google.firebase.crashlytics")

    id("androidx.navigation.safeargs.kotlin")
}

android {
    namespace 'com.crowncement.TsSalesTracking'
    compileSdk 34

    defaultConfig {
        applicationId "com.crowncement.TsSalesTracking"
        minSdk 23
        targetSdk 35
        versionCode 16
        versionName "1.0.21"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


    }



    buildTypes {

        debug {
            //  testCoverageEnabled false
            shrinkResources false
            // minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            firebaseCrashlytics {

                mappingFileUploadEnabled false

            }


        }

        release {
            testCoverageEnabled false
            debuggable false
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }

        }
//        release {
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//        }
    }

    //view binding
//    buildFeatures{
//        viewBinding  true
//    }
    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.google.android.material:material:1.6.1'


    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'


    //recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    //navigation
    // def navVersion = "2.3.5"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.0'

    //Firebase messaging services
    implementation 'com.google.firebase:firebase-messaging:24.1.0'

    //Circular image
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    //image slider
    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.0'

    //Graph
    // implementation 'com.github.mikephil.charting:mpandroidchart:3.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //shimmer effect
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation 'com.github.tapadoo:alerter:7.2.4'

    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    // implementation 'io.coil-kt:coil:0.6.1'
    implementation "io.coil-kt:coil-base:0.9.5"
    implementation 'io.coil-kt:coil:1.4.0'

    //Lotti Animation
    implementation 'com.airbnb.android:lottie:4.2.0'
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.7.2'

    implementation 'com.google.code.gson:gson:2.8.9'

    //Firebase Database
    implementation 'com.google.firebase:firebase-database:20.1.0'

//    // Room components
//    implementation "androidx.room:room-runtime:2.4.2"
//    implementation "androidx.room:room-ktx:2.4.2"

    // Room components
    implementation "androidx.room:room-runtime:2.4.2"
    implementation "androidx.room:room-ktx:2.4.2"
    androidTestImplementation "androidx.room:room-testing:2.4.2"
    kapt "androidx.room:room-compiler:2.4.2"

    //RXJava
    implementation 'io.reactivex.rxjava3:rxjava:3.0.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'com.google.firebase:firebase-inappmessaging-display:20.1.2'


    //MAP
  //  implementation 'com.google.android.gms:play-services-maps:18.0.2'
    implementation 'com.google.android.gms:play-services-location:20.0.0'

    // implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation("com.google.android.gms:play-services-maps:19.2.0")

    // implementation 'com.google.code.gson:gson:2.8.9'

    //Toast
    implementation 'com.github.Spikeysanju:MotionToast:1.4'

    //location
    implementation 'com.github.robinkrsingh:easylocation:0.1.1'

    //viewmodelprovider
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    //MapAnimator
    implementation 'com.github.tintinscorpion:Dual-color-Polyline-Animation:1.0'


    //qr code
    implementation 'com.google.zxing:core:3.4.0'

    //pie outerline chart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'


    //  implementation 'com.prolificinteractive:material-calendarview:1.4.3'

    implementation('com.prolificinteractive:material-calendarview:1.4.3') {
        exclude group: 'com.prolificinteractive.materialcalendarview', module: 'AnimatorListener'
    }

    //   implementation 'com.github.prolificinteractive:material-calendarview:2.0.0'

//    implementation('com.android.support:support-compat:27.1.0') {
//        exclude module: 'androidx.core'
//    }

    //Firebase analytics
    //implementation 'com.google.firebase:firebase-analytics:21.1.0'

    //Firebase messaging services
    //  implementation 'com.google.firebase:firebase-messaging:23.0.7'

    //multiple spinner

    implementation 'com.github.puskal-khadka:MultiSelectSpinner:1.0.1'


    implementation 'com.github.AnuraganuPunalur:Multi-Selection-Spinner-Android:1.0'

    //for image resize
    implementation 'id.zelory:compressor:3.0.1'


//added for mason image
    // implementation 'com.github.Shouheng88:compressor:latest-version'

    // google crashlytics
    // Import the BoM for the Firebase platform
    implementation(platform("com.google.firebase:firebase-bom:33.2.0"))
    // Add the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")


    configurations.all {
        resolutionStrategy {
            force 'com.android.support:support-v4:27.1.0'
            //   force "com.google.android.gms:play-services-location:21.0.1"


        }
    }

}